# Minimal prod server: serve the built SPA and proxy /api to the agent.
# The agent host defaults to the docker-compose service name `api:8000`.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback (single tabbed page, no server routes)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API + SSE proxy. SSE needs buffering off and long read timeouts.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding off;
  }
}
